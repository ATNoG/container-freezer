apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freeze-daemon-containerd
  namespace: knative-serving
spec:
  selector:
    matchLabels:
      name: freeze-daemon-containerd
  template:
    metadata:
      labels:
        name: freeze-daemon-containerd
    spec:
      serviceAccountName: freeze-tokenreview
      imagePullSecrets:
        - name: ghcr-pull-secret
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: daemon
          securityContext:
            runAsUser: 0
          image: ghcr.io/pmacoutinho/freezer-daemon:latest
          env:
            - name: RUNTIME_TYPE
              value: "containerd"
            - name: CONTAINERD_ADDRESS
              value: /run/k3s/containerd/containerd.sock
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: freezer-api-key
                  key: api-key
                  optional: true
            - name: FREEZER_LOGGING_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: config-freezer
                  key: freezer-logging-config
            - name: FREEZER_LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: config-freezer
                  key: freezer-logging-level
          ports:
            - containerPort: 8080
              hostPort: 9696
          volumeMounts:
            - name: containerd-socket
              mountPath: /run/k3s/containerd/containerd.sock
            - name: pods-log
              mountPath: /var/log/pods
            - name: freezer-fifo
              mountPath: /run/freezer-fifo
      volumes:
        - name: containerd-socket
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
        - name: pods-log
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: freezer-fifo
          hostPath:
            path: /run/freezer-fifo
            type: DirectoryOrCreate
